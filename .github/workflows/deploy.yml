name: Automated Deployment

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test application
        run: |
          python -c "from app import app; r = app.test_client().get('/'); assert r.status_code == 200; assert b'GitHub Deployment Experiment' in r.data; print('Application test passed')"
